services:
    app:
        build:
            context: .
            dockerfile: docker/8.5/Dockerfile.prod
            args:
                WWWGROUP: ${WWWGROUP:-1000}
                VITE_APP_NAME: ${VITE_APP_NAME:-Root Keeper}
                POSTGRES_VERSION: 18
        image: root-keeper-app:prod
        container_name: keeper-app
        restart: unless-stopped
        mem_limit: 1g
        cpus: 1.0
        pids_limit: 256
        environment:
            WWWUSER: ${WWWUSER:-1000}
            SUPERVISOR_PHP_USER: sail
        volumes:
            - ./storage:/var/www/html/storage
            - ${BACKUP_HOST_DIR:-/storage/root-keeper-backups}:/var/www/html/storage/app/backups
            - ./.env.prod:/var/www/html/.env:ro
        networks:
            - root-keeper-internal
            # Shared only with Traefik (kostecki-dev-infra), no internet; the app reaches the
            # internet (mail) through its own network above.
            - proxy-genealogy
        depends_on:
            pgsql:
                condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.docker.network=proxy-genealogy
            - traefik.http.routers.genealog.rule=Host(`genealogy.kostecki.dev`)
            - traefik.http.routers.genealog.entrypoints=websecure
            - traefik.http.routers.genealog.tls.certresolver=letsencrypt
            # Security headers shared by the apps: kostecki-dev-infra traefik/dynamic/app-security.yml
            - traefik.http.routers.genealog.middlewares=app-security@file
            - traefik.http.services.genealog.loadbalancer.server.port=80
            # Old address genealog.kostecki.dev: permanent redirect, path and query kept (301 GET, 308 POST).
            - traefik.http.routers.genealog-old.rule=Host(`genealog.kostecki.dev`)
            - traefik.http.routers.genealog-old.entrypoints=websecure
            - traefik.http.routers.genealog-old.tls.certresolver=letsencrypt
            - traefik.http.routers.genealog-old.service=genealog
            - traefik.http.routers.genealog-old.middlewares=genealog-old-host
            - traefik.http.middlewares.genealog-old-host.redirectregex.regex=^https?://genealog\.kostecki\.dev/(.*)
            - traefik.http.middlewares.genealog-old-host.redirectregex.replacement=https://genealogy.kostecki.dev/$${1}
            - traefik.http.middlewares.genealog-old-host.redirectregex.permanent=true

    pgsql:
        image: postgres:18-alpine
        container_name: keeper-pgsql
        restart: unless-stopped
        mem_limit: 512m
        cpus: 0.5
        pids_limit: 128
        environment:
            PGPASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - keeper-pgsql:/var/lib/postgresql
        networks:
            - root-keeper-internal
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -d ${DB_DATABASE} -U ${DB_USERNAME}',
                ]
            retries: 5
            timeout: 5s
            interval: 10s

networks:
    root-keeper-internal:
        driver: bridge
    proxy-genealogy:
        external: true

volumes:
    keeper-pgsql:
